---
mountPoints:
    - mountPoint: /
      fstype: ext4
      options: [ defaults, noatime ]
    - mountPoint: /home
      fstype: ext4
      options: [ defaults, noatime ]
    - mountPoint: /boot/efi
      fstype: vfat
      options: [ defaults, umask=0077 ]
      optional: true

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sysfs
      fs: sysfs
      mountPoint: /sys
    - device: devtmpfs
      fs: devtmpfs
      mountPoint: /dev
    - device: devpts
      fs: devpts
      mountPoint: /dev/pts
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]

